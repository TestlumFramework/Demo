name: mobilebrowser-and-native-regression-android

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Which suite to run
        type: choice
        required: false
        default: all
        options:
          - all
          - mobilebrowser
          - native
          - webview
  schedule:
    # Weekly, Mondays at 06:00 UTC.
    - cron: '0 6 * * 1'

concurrency:
  group: android-emulator
  cancel-in-progress: false

env:
  TESTLUM_IMAGE: ghcr.io/testlumframework/testlum:latest
  APK_PATH: testlum-app-test-debug.apk
  # Pinned so a weekly run cannot silently pick up a new Appium release.
  APPIUM_VERSION: 3.6.0
  UIAUTOMATOR2_VERSION: 8.2.2

jobs:
  matrix-setup:
    name: Resolve suites
    runs-on: ubuntu-latest
    outputs:
      suites: ${{ steps.pick.outputs.suites }}
    steps:
      - name: Pick suites
        id: pick
        env:
          SUITE: ${{ inputs.suite || 'all' }}
        run: |
          case "${SUITE}" in
            mobilebrowser) suites='["mobilebrowser"]' ;;
            native)        suites='["native"]' ;;
            webview)       suites='["webview"]' ;;
            *)             suites='["mobilebrowser","native","webview"]' ;;
          esac
          echo "Running suites: ${suites}"
          echo "suites=${suites}" >> "$GITHUB_OUTPUT"

  emulator-tests:
    name: ${{ matrix.suite }} on Android emulator
    needs: matrix-setup
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      # One wedged emulator must not cancel the other suites.
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.matrix-setup.outputs.suites) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Verify APK is present
        run: |
          if [ ! -f "${APK_PATH}" ]; then
            echo "::error::Missing ${APK_PATH}"
            exit 1
          fi

      - name: Create Docker network
        run: docker network create e2e_network

      - name: Start website (mega-test-site)
        run: |
          docker compose -f docker/docker-compose-mega-test-app.yaml --profile ci up -d --build mega-test-site

      - name: Wait for website to be healthy
        run: |
          for i in $(seq 1 30); do
            status="$(docker inspect -f '{{.State.Health.Status}}' mega-test-site 2>/dev/null || echo starting)"
            echo "mega-test-site health: ${status}"
            if [ "${status}" = "healthy" ]; then exit 0; fi
            sleep 5
          done
          echo "::error::mega-test-site did not become healthy in time"
          docker logs mega-test-site || true
          exit 1

      - name: Set up Node and Appium
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Appium and UiAutomator2 driver
        run: |
          npm install -g "appium@${APPIUM_VERSION}"
          appium driver install "uiautomator2@${UIAUTOMATOR2_VERSION}"
          appium --version

      - name: Pull Testlum image
        run: docker pull "${TESTLUM_IMAGE}"

      - name: Run ${{ matrix.suite }} tests on emulator
        id: emulator_run
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SUITE: ${{ matrix.suite }}
          CONFIG_FILE: config-ci-regression-mobile-emulator-${{ matrix.suite }}.xml
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          ram-size: 4096M
          cores: 2
          emulator-boot-timeout: 900
          emulator-options: >-
            -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none -no-metrics
          disable-animations: true
          script: bash .github/scripts/run-emulator-tests.sh

      - name: Collect Testlum report output
        if: always()
        run: |
          # Everything Testlum writes under REGRESSION/ is untracked, so git is an
          # exact way to find the Extent report and any failure screenshots without
          # having to guess the output path.
          mkdir -p testlum-output
          git status --porcelain --untracked-files=all -- REGRESSION \
            | awk '{print $2}' > /tmp/testlum-written.txt || true
          echo "Files written under REGRESSION/ during the run:"
          cat /tmp/testlum-written.txt
          while read -r f; do
            [ -f "$f" ] || continue
            mkdir -p "testlum-output/$(dirname "$f")"
            cp "$f" "testlum-output/$f"
          done < /tmp/testlum-written.txt

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-diagnostics-${{ matrix.suite }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            appium.log
            logcat.txt
            adb-health.log
            adb-devices.txt
            testlum-output/**

      - name: Teardown
        if: always()
        run: |
          docker compose -f docker/docker-compose-mega-test-app.yaml --profile ci down -v --timeout 10 || true
          docker network rm e2e_network || true

  notify:
    name: Slack notification
    needs: [matrix-setup, emulator-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Build Slack payload
        id: build_message
        env:
          OVERALL: ${{ needs.emulator-tests.result }}
          SUITES: ${{ needs.matrix-setup.outputs.suites }}
        run: |
          overall="${OVERALL}"
          suites="$(echo "${SUITES:-[]}" | jq -r 'join(", ")')"
          case "${overall}" in
            success)   icon="✅"; status="passed" ;;
            failure)   icon="❌"; status="failed" ;;
            cancelled) icon="⏹"; status="cancelled" ;;
            *)         icon="➖"; status="${overall}" ;;
          esac

          blocks=$(jq -n \
            --arg header "*${{ github.workflow }} #${{ github.run_number }}* | <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|🔎 Open Build>" \
            --arg line "${icon} *Android emulator* | suites: \`${suites}\` | \`${status}\`" \
            '[{"type":"section","text":{"type":"mrkdwn","text":$header}},{"type":"section","text":{"type":"mrkdwn","text":$line}}]')

          echo "payload=$(echo "$blocks" | jq -c .)" >> "$GITHUB_OUTPUT"

      - name: Slack Notification
        uses: slackapi/slack-github-action@v2
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_BOT_TOKEN }}
          payload: |
            channel: ${{ secrets.SLACK_CHANNEL_ID }}
            unfurl_links: false
            unfurl_media: false
            blocks: ${{ steps.build_message.outputs.payload }}
