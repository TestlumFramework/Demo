name: Run Testlum Regression Windows
description: Runs tests from DEMO repository using Testlum docker image on Windows runners.

inputs:
  image_tag:
    description: Testlum image tag to execute.
    required: true
  config_file:
    description: Config file passed to Testlum.
    required: true
  resources_path:
    description: Path to the mounted regression resources directory.
    required: false
    default: testlum-tests/REGRESSION

  sendgrid_api_key:
    description: SendGrid API key.
    required: false
    default: ""

  smtp_username:
    description: SMTP username.
    required: false
    default: ""

  smtp_password:
    description: SMTP password.
    required: false
    default: ""

  twilio_account_sid:
    description: Twilio account SID.
    required: false
    default: ""

  twilio_auth_token:
    description: Twilio auth token.
    required: false
    default: ""

  twilio_phone_number:
    description: Twilio phone number.
    required: false
    default: ""

  testrail_url:
    description: TestRail instance base API url.
    required: false
    default: ""

  testrail_username:
    description: TestRail username.
    required: false
    default: ""

  testrail_api_key:
    description: TestRail API key.
    required: false
    default: ""

  testrail_project_id:
    description: TestRail project the results belong to.
    required: false
    default: ""

  testrail_run_id:
    description: TestRail run created for this execution; read by each scenario's testRailRunId.
    required: false
    default: ""

  testrail_condition_case_id:
    description: TestRail case id read by the second TestRail scenario's testCaseId.
    required: false
    default: ""

  testrail_http_case_id:
    description: TestRail case id read by the first TestRail scenario's testCaseId.
    required: false
    default: ""

  testrail_db_case_id:
    description: TestRail case id read by the second TestRail scenario's testCaseId.
    required: false
    default: ""

runs:
  using: composite
  steps:

    - name: Set up Docker Engine
      uses: docker/setup-docker-action@v4

    - name: Launch Tests
      shell: pwsh
      env:
        TESTRAIL_URL: ${{ inputs.testrail_url }}
        TESTRAIL_USERNAME: ${{ inputs.testrail_username }}
        TESTRAIL_API_KEY: ${{ inputs.testrail_api_key }}
        TESTRAIL_PROJECT_ID: ${{ inputs.testrail_project_id }}
        TESTRAIL_RUN_ID: ${{ inputs.testrail_run_id }}
        TESTRAIL_CONDITION_CASE_ID: ${{ inputs.testrail_condition_case_id }}
        TESTRAIL_HTTP_CASE_ID: ${{ inputs.testrail_http_case_id }}
        TESTRAIL_DB_CASE_ID: ${{ inputs.testrail_db_case_id }}
      run: |
        $ErrorActionPreference = "Continue"

        $containerRoot = "C:\REGRESSION"
        $resourcesDir = "C:\REGRESSION\resources"
        $mountDir = (Resolve-Path (Join-Path "${{ github.workspace }}" "${{ inputs.resources_path }}")).Path
        $image = "ghcr.io/testlumframework/testlum:${{ inputs.image_tag }}"

        Write-Host "Running Testlum image: $image"
        Write-Host "Using config: ${{ inputs.config_file }}"
        Write-Host "Using resources: $mountDir"

        docker run -t --rm `
          --mount "type=bind,source=$mountDir,target=$containerRoot" `
          -e SENDGRID_API_KEY="${{ inputs.sendgrid_api_key }}" `
          -e SMTP_USERNAME="${{ inputs.smtp_username }}" `
          -e SMTP_PASSWORD="${{ inputs.smtp_password }}" `
          -e TWILIO_ACCOUNT_SID="${{ inputs.twilio_account_sid }}" `
          -e TWILIO_AUTH_TOKEN="${{ inputs.twilio_auth_token }}" `
          -e TWILIO_PHONE_NUMBER="${{ inputs.twilio_phone_number }}" `
          -e TESTRAIL_URL `
          -e TESTRAIL_USERNAME `
          -e TESTRAIL_API_KEY `
          -e TESTRAIL_PROJECT_ID `
          -e TESTRAIL_RUN_ID `
          -e TESTRAIL_CONDITION_CASE_ID `
          -e TESTRAIL_HTTP_CASE_ID `
          -e TESTRAIL_DB_CASE_ID `
          "$image" -c="${{ inputs.config_file }}" -p="$resourcesDir"
        $exitCode = $LASTEXITCODE

        Write-Host "Regression finished with exit code $exitCode"

        switch ($exitCode) {
          0 {
            Write-Host "BUILD STATUS [SUCCESS]"
            exit 0
          }
          1 {
            Write-Host "BUILD STATUS [FAILURE] - Tests failed"
            exit 1
          }
          2 {
            Write-Host "BUILD STATUS [FAILURE] - No tests found"
            exit 1
          }
          default {
            Write-Host "BUILD STATUS [FAILURE] - Invalid configuration or crash (Code: $exitCode)"
            exit 1
          }
        }
